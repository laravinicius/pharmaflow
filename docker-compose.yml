services:
  mariadb:
    image: mariadb:11
    container_name: pharmaflow
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: pharmaflow
      MARIADB_ROOT_PASSWORD: pharmaflow_root_dev
      MARIADB_USER: pharmaflow_app
      MARIADB_PASSWORD: pharmaflow_dev
    ports:
      - "3306:3306"
    volumes:
      - pharmaflow-mariadb-data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pharmaflow-mariadb-data:
